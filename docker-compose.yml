services:
  db:
    image: postgres:16-alpine
    container_name: jansahayak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jansahayak
      POSTGRES_USER: jansahayak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jansahayak_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jansahayak -d jansahayak"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jansahayak-redis
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: jansahayak-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://jansahayak:${POSTGRES_PASSWORD:-jansahayak_dev_password}@db:5432/jansahayak
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me}
      JWT_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: jansahayak-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_USE_MOCK: "false"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
